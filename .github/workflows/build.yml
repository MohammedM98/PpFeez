name: Build Windows

on:
  push:
    branches: [desktop]
  pull_request:
    branches: [desktop]
  workflow_dispatch:

# A running build always finishes (the UI and backend sessions push often); only the
# newest waiting run is kept.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-tests:
    name: Core tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: core

      - name: cargo test (ppfeez-core)
        working-directory: src-tauri
        run: cargo test -p ppfeez-core --locked

      - name: cargo clippy (ppfeez-core)
        working-directory: src-tauri
        run: cargo clippy -p ppfeez-core --locked --all-targets -- -D warnings

  bundle:
    name: Windows installer (NSIS .exe)
    needs: core-tests
    runs-on: windows-latest
    # Needed only to publish the GitHub Release (SPEC 6.9).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect frontend
        id: fe
        shell: pwsh
        run: |
          if (Test-Path package.json) { "present=true" >> $env:GITHUB_OUTPUT }
          else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Output "::notice title=Installer skipped::package.json is not on this branch yet (the UI session adds it). The installer is built once the frontend exists."
          }

      # Publish a release only for a pushed commit on desktop, when the signing key secret
      # exists and no release v{version} exists yet. Otherwise build the artifact only.
      - name: Decide release
        id: rel
        if: steps.fe.outputs.present == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $exists = $false
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $global:LASTEXITCODE = 0
          # Release notes: this version's section of docs/CHANGELOG.md.
          $notes = @(); $in = $false
          foreach ($line in Get-Content docs/CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## ') { if ($in) { break }; $in = ($line.Trim() -eq "## $version"); continue }
            if ($in) { $notes += $line }
          }
          $body = ($notes -join "`n").Trim()
          # 0.1.0 has no updater, so it is never published; a release also needs its own
          # CHANGELOG section (the rule for bumping the version, SPEC 6.9).
          $releasable = ([version]$version -gt [version]'0.1.0') -and [bool]$body
          $publish = ($env:HAS_SIGNING_KEY -eq 'true') -and (-not $exists) -and $releasable -and
                     ('${{ github.event_name }}' -eq 'push') -and ('${{ github.ref }}' -eq 'refs/heads/desktop')
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($env:HAS_SIGNING_KEY -ne 'true') {
            Write-Output "::notice title=Unsigned build::TAURI_SIGNING_PRIVATE_KEY is not set: building the installer without updater signatures and without a release."
          } elseif ($exists) {
            Write-Output "::notice title=No release::Release v$version already exists; bump the version in src-tauri/tauri.conf.json to publish a new one."
          } elseif (-not $releasable) {
            Write-Output "::notice title=No release::Version $version is not released (must be above 0.1.0 and have a '## $version' section in docs/CHANGELOG.md)."
          }
          if (-not $body) { $body = "PpFeez $version" }
          $delim = "EOF_$([guid]::NewGuid().ToString('N'))"
          "notes<<$delim" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          $delim >> $env:GITHUB_OUTPUT

      # The key is base64 and never contains whitespace, but a copied secret often ends with a
      # newline ("failed to decode base64 secret key: Invalid symbol 10"). Strip it here, mask
      # the cleaned value and hand both values to the build through the job environment.
      - name: Prepare signing key
        if: steps.fe.outputs.present == 'true' && env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $key = $env:RAW_KEY -replace '\s', ''
          $password = "$env:RAW_PASSWORD".TrimEnd("`r", "`n")
          Write-Output "::add-mask::$key"
          if ($password) { Write-Output "::add-mask::$password" }
          "TAURI_SIGNING_PRIVATE_KEY=$key" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v5
        if: steps.fe.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.fe.outputs.present == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.fe.outputs.present == 'true'
        with:
          workspaces: src-tauri -> target
          key: bundle

      - name: Install frontend dependencies
        if: steps.fe.outputs.present == 'true'
        run: npm ci

      - name: Build and publish release v${{ steps.rel.outputs.version }}
        if: steps.fe.outputs.present == 'true' && steps.rel.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: PpFeez __VERSION__
          releaseBody: ${{ steps.rel.outputs.notes }}
          releaseDraft: false
          prerelease: false
          releaseCommitish: ${{ github.sha }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: PpFeez-[version]-windows-[arch]-[bundle]

      - name: Build installer (signed, no release)
        if: steps.fe.outputs.present == 'true' && steps.rel.outputs.publish != 'true' && env.HAS_SIGNING_KEY == 'true'
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: PpFeez-[version]-windows-[arch]-[bundle]

      # Without the key, updater artifacts cannot be signed: build without them instead of failing.
      - name: Build installer (unsigned, no release)
        if: steps.fe.outputs.present == 'true' && env.HAS_SIGNING_KEY != 'true'
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis --config src-tauri/tauri.unsigned.conf.json
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: PpFeez-[version]-windows-[arch]-[bundle]
