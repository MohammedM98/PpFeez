[workspace]
members = [".", "crates/core"]
resolver = "2"

[package]
name = "ppfeez"
version = "0.1.0"
description = "PpFeez — محاسبة دفعات PayPal للعملاء"
edition = "2021"
publish = false

[lib]
name = "ppfeez_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ppfeez-core = { path = "crates/core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
