[package]
name = "ppfeez-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "PpFeez core: accounting, SQLite storage, Gmail IMAP pull and PayPal email parsers (no Tauri dependency)"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
mail-parser = "1.0"
scraper = "0.29"
ego-tree = "0.11"
keyring = "4.2"
argon2 = "0.6"
imap = "2.4.1"
native-tls = "0.2"
regex = "1"
psl = "2"
rust_xlsxwriter = "0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
calamine = "0.38"
zip = { version = "9", default-features = false, features = ["deflate"] }
